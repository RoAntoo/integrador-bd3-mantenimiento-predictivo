apiVersion: 1

datasources:
  - name: PostgreSQL_BD3
    type: postgres
    uid: pg_bd3_uid
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: "disable"
      postgresVersion: 1600
    isDefault: true
    editable: true
